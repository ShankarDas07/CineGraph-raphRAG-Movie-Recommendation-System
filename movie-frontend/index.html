<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CineGraph - ask a movie knowledge graph (Neo4j + Pinecone + Gemini) anything." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CineGraph - Movie Intelligence</title>
    <!--
      Runs before the page is painted, so a saved dark theme does not flash white on reload.
      Keep the key ("cinegraph.theme") in sync with THEME_KEY in src/context/ThemeContext.tsx.
    -->
    <script>
      try {
        if (localStorage.getItem("cinegraph.theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {
        /* storage blocked: stay on the light theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
